name: Tracked File Guards

on:
  push:
    paths:
      - ".github/workflows/tracked-file-privacy-guard.yml"
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
      - "cli/**"
      - "overlord_tooling/**"
      - "orchestration/**"
      - "pyproject.toml"
      - "subsystems/**"
      - "schemas/**"
      - "tests/**"
      - "*.ps1"
      - "*.py"
  pull_request:
    paths:
      - ".github/workflows/tracked-file-privacy-guard.yml"
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
      - "cli/**"
      - "overlord_tooling/**"
      - "orchestration/**"
      - "pyproject.toml"
      - "subsystems/**"
      - "schemas/**"
      - "tests/**"
      - "*.ps1"
      - "*.py"

jobs:
  tracked-file-guards:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tracked-file privacy guard
        shell: pwsh
        run: python -m overlord_tooling guard-tracked-files

      - name: Run workspace conventions guard
        shell: pwsh
        run: python -m overlord_tooling guard-workspace-conventions --repo-root .
